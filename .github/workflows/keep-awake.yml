name: Keep Streamlit app awake

on:
  schedule:
    - cron: "0 */6 * * *"   # toutes les 6 heures
  workflow_dispatch:         # permet aussi de le lancer à la main

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Visit app and wake it up if sleeping
        run: |
          python - <<'EOF'
          from playwright.sync_api import sync_playwright

          URL = "https://portfolioscan.streamlit.app/"

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto(URL, timeout=90_000)
              page.wait_for_timeout(10_000)

              button = page.get_by_role("button", name="Yes, get this app back up!")
              if button.count() > 0:
                  print("App endormie -> reveil en cours")
                  button.first.click()
                  page.wait_for_timeout(90_000)
              else:
                  print("App deja eveillee")
                  page.wait_for_timeout(30_000)

              browser.close()
          EOF
